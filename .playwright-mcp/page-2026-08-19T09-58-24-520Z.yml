      - generic [ref=f4e102]:
        - heading "Časté otázky" [level=2] [ref=f4e104]
        - generic [ref=f4e105]:
          - generic [ref=f4e106]:
            - heading "Koľko stojí vŕtanie studne?" [level=3] [ref=f4e107]
            - paragraph [ref=f4e108]: Orientačná cena je od 70€ za meter. Cena závisí od hĺbky vrtu, typu podložia a prístupnosti pozemku. Presnú cenu stanovíme po bezplatnej obhliadke.
          - generic [ref=f4e109]:
            - heading "Aká hĺbka vrtu je potrebná pre studňu?" [level=3] [ref=f4e110]
            - paragraph [ref=f4e111]: Hĺbka vrtu závisí od geologických podmienok, bežne je to 8 až 45 metrov. Voda sa nachádza v hĺbkach cca 10 – 40 metrov, podľa oblasti aj hlbšie.
          - generic [ref=f4e112]:
            - heading "Aké technológie používate na vŕtanie?" [level=3] [ref=f4e113]
            - paragraph [ref=f4e114]: Používame rotačné vŕtanie, výplachové vŕtanie ponorným kladivom aj hydraulickou vrtnou súpravou na gumených pásoch. Priemery vrtov sú 120 – 200 mm.
          - generic [ref=f4e115]:
            - heading "Kde všade pôsobíte?" [level=3] [ref=f4e116]
            - paragraph [ref=f4e117]: Pôsobíme v Žiline, Považskej Bystrici, Prievidzi, Martine a okolí v okruhu cca 80 km.
          - generic [ref=f4e118]:
            - heading "Ako dlho trvá vŕtanie studne?" [level=3] [ref=f4e119]
            - paragraph [ref=f4e120]: Vŕtanie studne trvá zvyčajne 1 – 3 dni podľa hĺbky vrtu a geologických podmienok. Samotné vŕtanie môže trvať len niekoľko hodín.
          - generic [ref=f4e121]:
            - heading "Potrebujem povolenie na vŕtanie studne?" [level=3] [ref=f4e122]
            - paragraph [ref=f4e123]: Na vŕtanie studne do hĺbky 50 m sa povolenie zvyčajne nevyžaduje, ale odporúčame sa informovať na príslušnom stavebnom úrade. Pri hlbších vrtoch môže byť potrebné súhlasné stanovisko.
          - generic [ref=f4e124]:
            - heading "Aká je životnosť vŕtanej studne?" [level=3] [ref=f4e125]
            - paragraph [ref=f4e126]: Pri správnom vystrojení a údržbe môže vŕtaná studňa slúžiť desaťročia. Kvalitná PVC pažnica a filtračná časť zabezpečujú dlhú životnosť bez problémov.
          - generic [ref=f4e127]:
            - heading "Čo je súčasťou ceny vŕtania?" [level=3] [ref=f4e128]
            - paragraph [ref=f4e129]: V cene je vystrojenie vrtu modrou atestovanou PVC studničnou rúrou, obsyp dunajským štrkom 4/8, utesnenie vrtu bentonitom a zátka na ukončenie rúry vrtu.
      - generic [ref=f4e131]:
        - generic [ref=f4e132]:
          - heading "Legislatíva na Slovensku" [level=2] [ref=f4e133]
          - paragraph [ref=f4e134]: Vŕtaná studňa je vodná stavba podliehajúca vodnému konaniu. My sa postaráme o celú administratívu.
        - generic [ref=f4e135]:
          - generic [ref=f4e136]:
            - heading "Povolenie na vŕtanie" [level=3] [ref=f4e137]
            - paragraph [ref=f4e138]: Vydáva Okresný úrad – odbor starostlivosti o životné prostredie. Potrebné pred začatím vŕtania.
          - generic [ref=f4e139]:
            - heading "Vodný zákon č. 364/2004 Z.z." [level=3] [ref=f4e140]
            - paragraph [ref=f4e141]: Upravuje nakladanie s podzemnými vodami, povolenia na odber a požiadavky na technické parametre vrtov.
          - generic [ref=f4e142]:
            - heading "Kolaudácia vodnej stavby" [level=3] [ref=f4e143]
            - paragraph [ref=f4e144]: Po dokončení je potrebná kolaudácia a zaevidovanie vrtu v Štátnom geologickom ústave Dionýza Štúra.
          - generic [ref=f4e145]:
            - heading "Povolenie na odber vody" [level=3] [ref=f4e146]
            - paragraph [ref=f4e147]: Pre osobné potreby (do 15 m³/deň) sa vydáva zjednodušeným konaním.
