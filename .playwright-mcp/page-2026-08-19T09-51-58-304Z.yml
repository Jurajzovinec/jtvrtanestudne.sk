      - generic [ref=f2e102]:
        - heading "Časté otázky" [level=2] [ref=f2e104]
        - generic [ref=f2e105]:
          - generic [ref=f2e106]:
            - heading "Koľko stojí vŕtanie studne?" [level=3] [ref=f2e107]
            - paragraph [ref=f2e108]: Orientačná cena je od 70€ za meter. Cena závisí od hĺbky vrtu, typu podložia a prístupnosti pozemku. Presnú cenu stanovíme po bezplatnej obhliadke.
          - generic [ref=f2e109]:
            - heading "Aká hĺbka vrtu je potrebná pre studňu?" [level=3] [ref=f2e110]
            - paragraph [ref=f2e111]: Hĺbka vrtu závisí od geologických podmienok, bežne je to 8 až 45 metrov. Voda sa nachádza v hĺbkach cca 10 – 40 metrov, podľa oblasti aj hlbšie.
          - generic [ref=f2e112]:
            - heading "Aké technológie používate na vŕtanie?" [level=3] [ref=f2e113]
            - paragraph [ref=f2e114]: Používame rotačné vŕtanie, výplachové vŕtanie ponorným kladivom aj hydraulickou vrtnou súpravou na gumených pásoch. Priemery vrtov sú 120 – 200 mm.
          - generic [ref=f2e115]:
            - heading "Kde všade pôsobíte?" [level=3] [ref=f2e116]
            - paragraph [ref=f2e117]: Pôsobíme v Žiline, Považskej Bystrici, Prievidzi, Martine a okolí v okruhu cca 80 km.
          - generic [ref=f2e118]:
            - heading "Ako dlho trvá vŕtanie studne?" [level=3] [ref=f2e119]
            - paragraph [ref=f2e120]: Vŕtanie studne trvá zvyčajne 1 – 3 dni podľa hĺbky vrtu a geologických podmienok. Samotné vŕtanie môže trvať len niekoľko hodín.
          - generic [ref=f2e121]:
            - heading "Potrebujem povolenie na vŕtanie studne?" [level=3] [ref=f2e122]
            - paragraph [ref=f2e123]: Na vŕtanie studne do hĺbky 50 m sa povolenie zvyčajne nevyžaduje, ale odporúčame sa informovať na príslušnom stavebnom úrade. Pri hlbších vrtoch môže byť potrebné súhlasné stanovisko.
          - generic [ref=f2e124]:
            - heading "Aká je životnosť vŕtanej studne?" [level=3] [ref=f2e125]
            - paragraph [ref=f2e126]: Pri správnom vystrojení a údržbe môže vŕtaná studňa slúžiť desaťročia. Kvalitná PVC pažnica a filtračná časť zabezpečujú dlhú životnosť bez problémov.
          - generic [ref=f2e127]:
            - heading "Čo je súčasťou ceny vŕtania?" [level=3] [ref=f2e128]
            - paragraph [ref=f2e129]: V cene je vystrojenie vrtu modrou atestovanou PVC studničnou rúrou, obsyp dunajským štrkom 4/8, utesnenie vrtu bentonitom a zátka na ukončenie rúry vrtu.
      - generic [ref=f2e131]:
        - generic [ref=f2e132]:
          - heading "Legislatíva na Slovensku" [level=2] [ref=f2e133]
          - paragraph [ref=f2e134]: Vŕtaná studňa je vodná stavba podliehajúca vodnému konaniu. My sa postaráme o celú administratívu.
        - generic [ref=f2e135]:
          - generic [ref=f2e136]:
            - heading "Povolenie na vŕtanie" [level=3] [ref=f2e137]
            - paragraph [ref=f2e138]: Vydáva Okresný úrad – odbor starostlivosti o životné prostredie. Potrebné pred začatím vŕtania.
          - generic [ref=f2e139]:
            - heading "Vodný zákon č. 364/2004 Z.z." [level=3] [ref=f2e140]
            - paragraph [ref=f2e141]: Upravuje nakladanie s podzemnými vodami, povolenia na odber a požiadavky na technické parametre vrtov.
          - generic [ref=f2e142]:
            - heading "Kolaudácia vodnej stavby" [level=3] [ref=f2e143]
            - paragraph [ref=f2e144]: Po dokončení je potrebná kolaudácia a zaevidovanie vrtu v Štátnom geologickom ústave Dionýza Štúra.
          - generic [ref=f2e145]:
            - heading "Povolenie na odber vody" [level=3] [ref=f2e146]
            - paragraph [ref=f2e147]: Pre osobné potreby (do 15 m³/deň) sa vydáva zjednodušeným konaním.
