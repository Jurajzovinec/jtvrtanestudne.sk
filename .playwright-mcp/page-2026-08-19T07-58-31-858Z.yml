      - generic [ref=e101]:
        - heading "Časté otázky" [level=2] [ref=e103]
        - generic [ref=e104]:
          - generic [ref=e105]:
            - heading "Koľko stojí vŕtanie studne?" [level=3] [ref=e106]
            - paragraph [ref=e107]: Orientačná cena je od 70€ za meter. Cena závisí od hĺbky vrtu, typu podložia a prístupnosti pozemku. Presnú cenu stanovíme po bezplatnej obhliadke.
          - generic [ref=e108]:
            - heading "Aká hĺbka vrtu je potrebná pre studňu?" [level=3] [ref=e109]
            - paragraph [ref=e110]: Hĺbka vrtu závisí od geologických podmienok, bežne je to 8 až 45 metrov. Voda sa nachádza v hĺbkach cca 10 – 40 metrov, podľa oblasti aj hlbšie.
          - generic [ref=e111]:
            - heading "Aké technológie používate na vŕtanie?" [level=3] [ref=e112]
            - paragraph [ref=e113]: Používame rotačné vŕtanie, výplachové vŕtanie ponorným kladivom aj hydraulickou vrtnou súpravou na gumených pásoch. Priemery vrtov sú 120 – 200 mm.
          - generic [ref=e114]:
            - heading "Kde všade pôsobíte?" [level=3] [ref=e115]
            - paragraph [ref=e116]: Pôsobíme v Žiline, Považskej Bystrici, Prievidzi, Martine a okolí v okruhu cca 80 km.
          - generic [ref=e117]:
            - heading "Ako dlho trvá vŕtanie studne?" [level=3] [ref=e118]
            - paragraph [ref=e119]: Vŕtanie studne trvá zvyčajne 1 – 3 dni podľa hĺbky vrtu a geologických podmienok. Samotné vŕtanie môže trvať len niekoľko hodín.
          - generic [ref=e120]:
            - heading "Potrebujem povolenie na vŕtanie studne?" [level=3] [ref=e121]
            - paragraph [ref=e122]: Na vŕtanie studne do hĺbky 50 m sa povolenie zvyčajne nevyžaduje, ale odporúčame sa informovať na príslušnom stavebnom úrade. Pri hlbších vrtoch môže byť potrebné súhlasné stanovisko.
          - generic [ref=e123]:
            - heading "Aká je životnosť vŕtanej studne?" [level=3] [ref=e124]
            - paragraph [ref=e125]: Pri správnom vystrojení a údržbe môže vŕtaná studňa slúžiť desaťročia. Kvalitná PVC pažnica a filtračná časť zabezpečujú dlhú životnosť bez problémov.
          - generic [ref=e126]:
            - heading "Čo je súčasťou ceny vŕtania?" [level=3] [ref=e127]
            - paragraph [ref=e128]: V cene je vystrojenie vrtu modrou atestovanou PVC studničnou rúrou, obsyp dunajským štrkom 4/8, utesnenie vrtu bentonitom a zátka na ukončenie rúry vrtu.
      - generic [ref=e130]:
        - generic [ref=e131]:
          - heading "Legislatíva na Slovensku" [level=2] [ref=e132]
          - paragraph [ref=e133]: Vŕtaná studňa je vodná stavba podliehajúca vodnému konaniu. My sa postaráme o celú administratívu.
        - generic [ref=e134]:
          - generic [ref=e135]:
            - heading "Povolenie na vŕtanie" [level=3] [ref=e136]
            - paragraph [ref=e137]: Vydáva Okresný úrad – odbor starostlivosti o životné prostredie. Potrebné pred začatím vŕtania.
          - generic [ref=e138]:
            - heading "Vodný zákon č. 364/2004 Z.z." [level=3] [ref=e139]
            - paragraph [ref=e140]: Upravuje nakladanie s podzemnými vodami, povolenia na odber a požiadavky na technické parametre vrtov.
          - generic [ref=e141]:
            - heading "Kolaudácia vodnej stavby" [level=3] [ref=e142]
            - paragraph [ref=e143]: Po dokončení je potrebná kolaudácia a zaevidovanie vrtu v Štátnom geologickom ústave Dionýza Štúra.
          - generic [ref=e144]:
            - heading "Povolenie na odber vody" [level=3] [ref=e145]
            - paragraph [ref=e146]: Pre osobné potreby (do 15 m³/deň) sa vydáva zjednodušeným konaním.
