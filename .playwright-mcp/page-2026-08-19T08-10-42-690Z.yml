      - generic [ref=f1e101]:
        - heading "Časté otázky" [level=2] [ref=f1e103]
        - generic [ref=f1e104]:
          - generic [ref=f1e105]:
            - heading "Koľko stojí vŕtanie studne?" [level=3] [ref=f1e106]
            - paragraph [ref=f1e107]: Orientačná cena je od 70€ za meter. Cena závisí od hĺbky vrtu, typu podložia a prístupnosti pozemku. Presnú cenu stanovíme po bezplatnej obhliadke.
          - generic [ref=f1e108]:
            - heading "Aká hĺbka vrtu je potrebná pre studňu?" [level=3] [ref=f1e109]
            - paragraph [ref=f1e110]: Hĺbka vrtu závisí od geologických podmienok, bežne je to 8 až 45 metrov. Voda sa nachádza v hĺbkach cca 10 – 40 metrov, podľa oblasti aj hlbšie.
          - generic [ref=f1e111]:
            - heading "Aké technológie používate na vŕtanie?" [level=3] [ref=f1e112]
            - paragraph [ref=f1e113]: Používame rotačné vŕtanie, výplachové vŕtanie ponorným kladivom aj hydraulickou vrtnou súpravou na gumených pásoch. Priemery vrtov sú 120 – 200 mm.
          - generic [ref=f1e114]:
            - heading "Kde všade pôsobíte?" [level=3] [ref=f1e115]
            - paragraph [ref=f1e116]: Pôsobíme v Žiline, Považskej Bystrici, Prievidzi, Martine a okolí v okruhu cca 80 km.
          - generic [ref=f1e117]:
            - heading "Ako dlho trvá vŕtanie studne?" [level=3] [ref=f1e118]
            - paragraph [ref=f1e119]: Vŕtanie studne trvá zvyčajne 1 – 3 dni podľa hĺbky vrtu a geologických podmienok. Samotné vŕtanie môže trvať len niekoľko hodín.
          - generic [ref=f1e120]:
            - heading "Potrebujem povolenie na vŕtanie studne?" [level=3] [ref=f1e121]
            - paragraph [ref=f1e122]: Na vŕtanie studne do hĺbky 50 m sa povolenie zvyčajne nevyžaduje, ale odporúčame sa informovať na príslušnom stavebnom úrade. Pri hlbších vrtoch môže byť potrebné súhlasné stanovisko.
          - generic [ref=f1e123]:
            - heading "Aká je životnosť vŕtanej studne?" [level=3] [ref=f1e124]
            - paragraph [ref=f1e125]: Pri správnom vystrojení a údržbe môže vŕtaná studňa slúžiť desaťročia. Kvalitná PVC pažnica a filtračná časť zabezpečujú dlhú životnosť bez problémov.
          - generic [ref=f1e126]:
            - heading "Čo je súčasťou ceny vŕtania?" [level=3] [ref=f1e127]
            - paragraph [ref=f1e128]: V cene je vystrojenie vrtu modrou atestovanou PVC studničnou rúrou, obsyp dunajským štrkom 4/8, utesnenie vrtu bentonitom a zátka na ukončenie rúry vrtu.
      - generic [ref=f1e130]:
        - generic [ref=f1e131]:
          - heading "Legislatíva na Slovensku" [level=2] [ref=f1e132]
          - paragraph [ref=f1e133]: Vŕtaná studňa je vodná stavba podliehajúca vodnému konaniu. My sa postaráme o celú administratívu.
        - generic [ref=f1e134]:
          - generic [ref=f1e135]:
            - heading "Povolenie na vŕtanie" [level=3] [ref=f1e136]
            - paragraph [ref=f1e137]: Vydáva Okresný úrad – odbor starostlivosti o životné prostredie. Potrebné pred začatím vŕtania.
          - generic [ref=f1e138]:
            - heading "Vodný zákon č. 364/2004 Z.z." [level=3] [ref=f1e139]
            - paragraph [ref=f1e140]: Upravuje nakladanie s podzemnými vodami, povolenia na odber a požiadavky na technické parametre vrtov.
          - generic [ref=f1e141]:
            - heading "Kolaudácia vodnej stavby" [level=3] [ref=f1e142]
            - paragraph [ref=f1e143]: Po dokončení je potrebná kolaudácia a zaevidovanie vrtu v Štátnom geologickom ústave Dionýza Štúra.
          - generic [ref=f1e144]:
            - heading "Povolenie na odber vody" [level=3] [ref=f1e145]
            - paragraph [ref=f1e146]: Pre osobné potreby (do 15 m³/deň) sa vydáva zjednodušeným konaním.
