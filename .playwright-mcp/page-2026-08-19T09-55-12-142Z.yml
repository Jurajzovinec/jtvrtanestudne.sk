      - generic [ref=f3e102]:
        - heading "Časté otázky" [level=2] [ref=f3e104]
        - generic [ref=f3e105]:
          - generic [ref=f3e106]:
            - heading "Koľko stojí vŕtanie studne?" [level=3] [ref=f3e107]
            - paragraph [ref=f3e108]: Orientačná cena je od 70€ za meter. Cena závisí od hĺbky vrtu, typu podložia a prístupnosti pozemku. Presnú cenu stanovíme po bezplatnej obhliadke.
          - generic [ref=f3e109]:
            - heading "Aká hĺbka vrtu je potrebná pre studňu?" [level=3] [ref=f3e110]
            - paragraph [ref=f3e111]: Hĺbka vrtu závisí od geologických podmienok, bežne je to 8 až 45 metrov. Voda sa nachádza v hĺbkach cca 10 – 40 metrov, podľa oblasti aj hlbšie.
          - generic [ref=f3e112]:
            - heading "Aké technológie používate na vŕtanie?" [level=3] [ref=f3e113]
            - paragraph [ref=f3e114]: Používame rotačné vŕtanie, výplachové vŕtanie ponorným kladivom aj hydraulickou vrtnou súpravou na gumených pásoch. Priemery vrtov sú 120 – 200 mm.
          - generic [ref=f3e115]:
            - heading "Kde všade pôsobíte?" [level=3] [ref=f3e116]
            - paragraph [ref=f3e117]: Pôsobíme v Žiline, Považskej Bystrici, Prievidzi, Martine a okolí v okruhu cca 80 km.
          - generic [ref=f3e118]:
            - heading "Ako dlho trvá vŕtanie studne?" [level=3] [ref=f3e119]
            - paragraph [ref=f3e120]: Vŕtanie studne trvá zvyčajne 1 – 3 dni podľa hĺbky vrtu a geologických podmienok. Samotné vŕtanie môže trvať len niekoľko hodín.
          - generic [ref=f3e121]:
            - heading "Potrebujem povolenie na vŕtanie studne?" [level=3] [ref=f3e122]
            - paragraph [ref=f3e123]: Na vŕtanie studne do hĺbky 50 m sa povolenie zvyčajne nevyžaduje, ale odporúčame sa informovať na príslušnom stavebnom úrade. Pri hlbších vrtoch môže byť potrebné súhlasné stanovisko.
          - generic [ref=f3e124]:
            - heading "Aká je životnosť vŕtanej studne?" [level=3] [ref=f3e125]
            - paragraph [ref=f3e126]: Pri správnom vystrojení a údržbe môže vŕtaná studňa slúžiť desaťročia. Kvalitná PVC pažnica a filtračná časť zabezpečujú dlhú životnosť bez problémov.
          - generic [ref=f3e127]:
            - heading "Čo je súčasťou ceny vŕtania?" [level=3] [ref=f3e128]
            - paragraph [ref=f3e129]: V cene je vystrojenie vrtu modrou atestovanou PVC studničnou rúrou, obsyp dunajským štrkom 4/8, utesnenie vrtu bentonitom a zátka na ukončenie rúry vrtu.
      - generic [ref=f3e131]:
        - generic [ref=f3e132]:
          - heading "Legislatíva na Slovensku" [level=2] [ref=f3e133]
          - paragraph [ref=f3e134]: Vŕtaná studňa je vodná stavba podliehajúca vodnému konaniu. My sa postaráme o celú administratívu.
        - generic [ref=f3e135]:
          - generic [ref=f3e136]:
            - heading "Povolenie na vŕtanie" [level=3] [ref=f3e137]
            - paragraph [ref=f3e138]: Vydáva Okresný úrad – odbor starostlivosti o životné prostredie. Potrebné pred začatím vŕtania.
          - generic [ref=f3e139]:
            - heading "Vodný zákon č. 364/2004 Z.z." [level=3] [ref=f3e140]
            - paragraph [ref=f3e141]: Upravuje nakladanie s podzemnými vodami, povolenia na odber a požiadavky na technické parametre vrtov.
          - generic [ref=f3e142]:
            - heading "Kolaudácia vodnej stavby" [level=3] [ref=f3e143]
            - paragraph [ref=f3e144]: Po dokončení je potrebná kolaudácia a zaevidovanie vrtu v Štátnom geologickom ústave Dionýza Štúra.
          - generic [ref=f3e145]:
            - heading "Povolenie na odber vody" [level=3] [ref=f3e146]
            - paragraph [ref=f3e147]: Pre osobné potreby (do 15 m³/deň) sa vydáva zjednodušeným konaním.
