      - generic [ref=e102]:
        - heading "Časté otázky" [level=2] [ref=e104]
        - generic [ref=e105]:
          - generic [ref=e106]:
            - heading "Koľko stojí vŕtanie studne?" [level=3] [ref=e107]
            - paragraph [ref=e108]: Orientačná cena je od 70€ za meter. Cena závisí od hĺbky vrtu, typu podložia a prístupnosti pozemku. Presnú cenu stanovíme po bezplatnej obhliadke.
          - generic [ref=e109]:
            - heading "Aká hĺbka vrtu je potrebná pre studňu?" [level=3] [ref=e110]
            - paragraph [ref=e111]: Hĺbka vrtu závisí od geologických podmienok, bežne je to 8 až 45 metrov. Voda sa nachádza v hĺbkach cca 10 – 40 metrov, podľa oblasti aj hlbšie.
          - generic [ref=e112]:
            - heading "Aké technológie používate na vŕtanie?" [level=3] [ref=e113]
            - paragraph [ref=e114]: Používame rotačné vŕtanie, výplachové vŕtanie ponorným kladivom aj hydraulickou vrtnou súpravou na gumených pásoch. Priemery vrtov sú 120 – 200 mm.
          - generic [ref=e115]:
            - heading "Kde všade pôsobíte?" [level=3] [ref=e116]
            - paragraph [ref=e117]: Pôsobíme v Žiline, Považskej Bystrici, Prievidzi, Martine a okolí v okruhu cca 80 km.
          - generic [ref=e118]:
            - heading "Ako dlho trvá vŕtanie studne?" [level=3] [ref=e119]
            - paragraph [ref=e120]: Vŕtanie studne trvá zvyčajne 1 – 3 dni podľa hĺbky vrtu a geologických podmienok. Samotné vŕtanie môže trvať len niekoľko hodín.
          - generic [ref=e121]:
            - heading "Potrebujem povolenie na vŕtanie studne?" [level=3] [ref=e122]
            - paragraph [ref=e123]: Na vŕtanie studne do hĺbky 50 m sa povolenie zvyčajne nevyžaduje, ale odporúčame sa informovať na príslušnom stavebnom úrade. Pri hlbších vrtoch môže byť potrebné súhlasné stanovisko.
          - generic [ref=e124]:
            - heading "Aká je životnosť vŕtanej studne?" [level=3] [ref=e125]
            - paragraph [ref=e126]: Pri správnom vystrojení a údržbe môže vŕtaná studňa slúžiť desaťročia. Kvalitná PVC pažnica a filtračná časť zabezpečujú dlhú životnosť bez problémov.
          - generic [ref=e127]:
            - heading "Čo je súčasťou ceny vŕtania?" [level=3] [ref=e128]
            - paragraph [ref=e129]: V cene je vystrojenie vrtu modrou atestovanou PVC studničnou rúrou, obsyp dunajským štrkom 4/8, utesnenie vrtu bentonitom a zátka na ukončenie rúry vrtu.
      - generic [ref=e131]:
        - generic [ref=e132]:
          - heading "Legislatíva na Slovensku" [level=2] [ref=e133]
          - paragraph [ref=e134]: Vŕtaná studňa je vodná stavba podliehajúca vodnému konaniu. My sa postaráme o celú administratívu.
        - generic [ref=e135]:
          - generic [ref=e136]:
            - heading "Povolenie na vŕtanie" [level=3] [ref=e137]
            - paragraph [ref=e138]: Vydáva Okresný úrad – odbor starostlivosti o životné prostredie. Potrebné pred začatím vŕtania.
          - generic [ref=e139]:
            - heading "Vodný zákon č. 364/2004 Z.z." [level=3] [ref=e140]
            - paragraph [ref=e141]: Upravuje nakladanie s podzemnými vodami, povolenia na odber a požiadavky na technické parametre vrtov.
          - generic [ref=e142]:
            - heading "Kolaudácia vodnej stavby" [level=3] [ref=e143]
            - paragraph [ref=e144]: Po dokončení je potrebná kolaudácia a zaevidovanie vrtu v Štátnom geologickom ústave Dionýza Štúra.
          - generic [ref=e145]:
            - heading "Povolenie na odber vody" [level=3] [ref=e146]
            - paragraph [ref=e147]: Pre osobné potreby (do 15 m³/deň) sa vydáva zjednodušeným konaním.
